<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}Double Hound</title>
{% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
<link rel="icon" type="image/png" sizes="32x32" href="/shared/favicon-32.png">
<link rel="apple-touch-icon" href="/shared/apple-touch-icon.png">
<link rel="stylesheet" href="/shared/site.css">
</head>
<body>
{% unless page.hero %}<header class="site"><a href="/"><img src="/shared/double-hound-mark.png" alt=""><span>Double <b>Hound</b></span></a></header>{% endunless %}
{{ content }}
<footer>© {{ site.time | date: "%Y" }} Double Hound · <a href="mailto:dev@doublehound.com">dev@doublehound.com</a></footer>
</body>
</html>
